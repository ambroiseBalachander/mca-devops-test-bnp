# Configuration nginx complète pour une SPA Angular (Chainguard non-root)
# avec proxying des requêtes API vers le Backend interne Kubernetes.

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Chemins temporaires requis pour tourner en mode non-root (/tmp)
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    proxy_temp_path       /tmp/proxy_temp;
    scgi_temp_path        /tmp/scgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;

    server {
        listen 80;
        server_name localhost;

        # 1. Gestion des fichiers statiques Angular
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # Fallback vers index.html pour le routing côté client (Angular)
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxying vers le backend Spring Boot interne Kubernetes
        location /api/ {
            # Nom du service Helm Kubernetes pour le backend
            proxy_pass http://mca-app-backend.mca-app.svc.cluster.local:8080/;

            # Transmettre les en-têtes HTTP d'origine
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
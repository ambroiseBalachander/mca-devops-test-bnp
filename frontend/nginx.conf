# Configuration nginx complète (remplace le fichier principal, pas un
# fragment conf.d) pour une Single Page Application (SPA) Angular,
# adaptée au mode non-root de Chainguard.

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Chemins temporaires requis pour tourner en mode non-root :
    # les chemins par défaut de nginx (souvent /var/run/...) appartiennent
    # à root — /tmp est accessible en écriture par n'importe quel utilisateur.
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    proxy_temp_path       /tmp/proxy_temp;
    scgi_temp_path        /tmp/scgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;

    server {
        listen 8080;
        server_name localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # Le routing Angular (/users, /adduser) se fait côté client.
            # Saans ce fllback, un accès direct ou un refresh (F5) sur ces
            # routes renverrait une 404 (nginx chercherait un fichier
            # physique "users" qui n'existe pas).
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
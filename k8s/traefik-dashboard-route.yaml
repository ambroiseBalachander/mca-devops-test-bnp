apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: traefik-system
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: traefik-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames: ["traefik.local"]
  rules:
    - backendRefs:
        - name: traefik-dashboard
          port: 8080